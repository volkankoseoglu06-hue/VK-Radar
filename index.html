<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b46">
  <title>VK Analiz | Havacılık Mühendisliği</title>
  <meta name="description" content="Havacılık mühendisliği için standart parça, ağırlık, malzeme fiyatı ve toleranslandırma çalışma alanı.">
  <link rel="stylesheet" href="style.css?v=20261014-tolerans-ui">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="VK Analiz ana sayfa">
      <span class="brand-mark" aria-hidden="true">VK</span>
      <span class="brand-copy"><strong>VK ANALİZ</strong><small>HAVACILIK MÜHENDİSLİĞİ</small></span>
    </a>
    <div class="topbar-right"><span class="status-dot"></span><span>Mühendislik çalışma alanı</span></div>
  </header>

  <main id="home" class="page">
    <section class="section-heading">
      <div><p class="eyebrow">ÇALIŞMA ALANLARI</p><h2>Ne yapmak istiyorsun?</h2></div>
      <span class="section-note">Bir araç seçerek devam et</span>
    </section>

    <section class="tool-grid" aria-label="Çalışma alanları">
      <button class="tool-card" data-view="standards">
        <span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M5 4.5h10l4 4V20H5zM15 4.5V9h4M8 13h8M8 16.5h8"/></svg></span>
        <span class="tool-title">Standart Parça Kataloğu</span>
        <span class="tool-desc">Standart numarası, üretici ve ürün bağlantılarını araştır.</span>
        <span class="tool-link">Kataloğu aç <b>→</b></span>
      </button>
      <button class="tool-card" data-view="weight">
        <span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M12 3v3M7 6h10M5 20h14l-2-11H7zM9 12h6M10 15h4"/></svg></span>
        <span class="tool-title">Ağırlık Hesaplama</span>
        <span class="tool-desc">Geometrik ölçüler ve yoğunluk ile teorik ağırlığı hesapla.</span>
        <span class="tool-link">Hesaplamayı aç <b>→</b></span>
      </button>
      <button class="tool-card" data-view="materials">
        <span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5-8 4.5zM4 7.5V17l8 4 8-4V7.5M12 12v9"/></svg></span>
        <span class="tool-title">Malzeme Fiyatları</span>
        <span class="tool-desc">Ham malzeme fiyatlarını USD/kg olarak kaydet ve yönet.</span>
        <span class="tool-link">Fiyatları aç <b>→</b></span>
      </button>
      <button class="tool-card" data-view="tolerance">
        <span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M11 15v6"/></svg></span>
        <span class="tool-title">Toleranslandırma</span>
        <span class="tool-desc">ISO geçmelerini ara, ölçü limitlerini ve konum toleranslarını hesapla.</span>
        <span class="tool-link">Tolerans aracını aç <b>→</b></span>
      </button>
    </section>

    <section class="recent-panel">
      <div class="recent-heading"><div><p class="eyebrow">HIZLI ERİŞİM</p><h2>Son çalışmalar</h2></div><span class="recent-count" id="recentCount">0 kayıt</span></div>
      <div id="recentList" class="recent-empty"><span class="empty-icon">↗</span><span><strong>Henüz kayıt yok</strong><small>Çalışmaların burada listelenecek.</small></span></div>
    </section>
    <footer><span>VK ANALİZ</span><span>Havacılık için sade mühendislik araçları</span></footer>
  </main>

  <main id="workspace" class="page workspace hidden">
    <button class="back-button" id="backHome">← Ana menü</button>
    <section class="workspace-head"><p class="eyebrow" id="viewEyebrow">ÇALIŞMA ALANI</p><h1 id="viewTitle">Araç</h1><p id="viewDescription"></p></section>
    <section id="viewContent" class="workspace-content"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=20261014-tolerans-ui"></script>
</body>
</html>
